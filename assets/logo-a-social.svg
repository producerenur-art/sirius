<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" fill="none" role="img" aria-label="Sirius FM">
  <defs>
    <radialGradient id="A-bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%"   stop-color="#132347"/>
      <stop offset="55%"  stop-color="#070c1d"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>
    <radialGradient id="A-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#bfeaff"/>
      <stop offset="72%" stop-color="#6fd3ff"/>
      <stop offset="100%" stop-color="#a98bff"/>
    </radialGradient>
    <radialGradient id="A-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6fd3ff" stop-opacity=".55"/>
      <stop offset="45%"  stop-color="#a98bff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a98bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="A-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6fd3ff" stop-opacity=".9"/>
      <stop offset="55%"  stop-color="#a98bff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#6fd3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="A-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#6fd3ff"/>
      <stop offset="100%" stop-color="#a98bff"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#A-bg)"/>

  <!-- stjernestøv -->
  <g fill="#eaf2ff">
    <circle cx="122" cy="168" r="2.6" opacity=".55"/><circle cx="938" cy="212" r="2" opacity=".45"/>
    <circle cx="243" cy="861" r="2.2" opacity=".4"/><circle cx="874" cy="806" r="3" opacity=".5"/>
    <circle cx="640" cy="120" r="1.8" opacity=".35"/><circle cx="180" cy="520" r="1.8" opacity=".3"/>
    <circle cx="960" cy="560" r="2.4" opacity=".35"/><circle cx="420" cy="940" r="1.8" opacity=".3"/>
  </g>

  <g transform="translate(540 430) scale(3.9) translate(-50 -50)">
    <circle cx="50" cy="50" r="46" fill="url(#A-glow)"/>
    <ellipse cx="50" cy="50" rx="40" ry="14.5" stroke="url(#A-ring)" stroke-width="1.6"
             transform="rotate(-24 50 50)" opacity=".85"/>
    <path d="M50 18 Q52.4 47.6 82 50 Q52.4 52.4 50 82 Q47.6 52.4 18 50 Q47.6 47.6 50 18 Z"
          fill="#a98bff" opacity=".5" transform="rotate(45 50 50)"/>
    <path d="M50 3 Q53 47 97 50 Q53 53 50 97 Q47 53 3 50 Q47 47 50 3 Z" fill="url(#A-core)"/>
    <circle cx="50" cy="50" r="7" fill="#ffffff" opacity=".95"/>
    <circle cx="50" cy="50" r="11.5" fill="url(#A-core)" opacity=".35"/>
  </g>

  <text x="540" y="820" text-anchor="middle" fill="url(#A-word)"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800"
        font-size="128" letter-spacing="14">SIRIUS</text>
  <text x="540" y="884" text-anchor="middle" fill="#93a4c7"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600"
        font-size="30" letter-spacing="13">WEB&#160;&#160;&#160;RADIO</text>

  <g>
    <rect x="378" y="932" width="324" height="60" rx="30" fill="rgba(14,20,40,0.55)"
          stroke="rgba(140,170,230,0.22)"/>
    <text x="540" y="971" text-anchor="middle" fill="#eaf2ff"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600"
          font-size="27" letter-spacing="4">siriusfm.no</text>
  </g>
</svg>
